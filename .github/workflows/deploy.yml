name: Deploy Node.js Backend to Droplets

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        droplet: [1, 2]
      fail-fast: false # Continue deploying to other droplets even if one fails

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set droplet variables
        id: vars
        run: |
          if [ "${{ matrix.droplet }}" == "1" ]; then
            echo "host=${{ secrets.REMOTE_HOST }}" >> $GITHUB_OUTPUT
          else
            echo "host=${{ secrets.REMOTE_HOST_2 }}" >> $GITHUB_OUTPUT
          fi

      - name: Deploy to Droplet ${{ matrix.droplet }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.vars.outputs.host }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e

            # Load Node.js environment
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

            # Ensure npm and pm2 are in PATH
            export PATH="$HOME/.npm-global/bin:$PATH"

            cd ${{ secrets.REMOTE_PATH }}

            echo '📦 Pulling latest code...'
            git pull origin release

            echo '📦 Installing dependencies...'
            npm install --production

            echo '🔧 Generating Prisma Client...'
            npx prisma generate

            echo '🚀 Restarting PM2...'
            pm2 reload all

            echo '✅ PM2 status:'
            pm2 list

            echo '🔁 Reloading OpenResty...'
            echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S /usr/local/openresty/bin/openresty -s reload

            echo '✅ Deployment completed successfully on Droplet ${{ matrix.droplet }}!'
